[package]
name = "visiblement-thumbs"
version = "0.1.0"
edition = "2024"
description = "Explorer thumbnails for videos, drawn by Visiblement's libmpv"
license = "MIT"

[lib]
name = "visiblement_thumbs"
crate-type = ["cdylib", "rlib"]

[dependencies]
libloading = "0.8"
png = "0.18.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
