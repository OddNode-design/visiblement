[package]
name = "visiblement"
version = "0.1.6"
edition = "2024"
description = "Visiblement, a fast GPU-accelerated video player for Windows built on libmpv"
license = "MIT"

[dependencies]
arboard = "3.7.0"
libloading = "0.8"
png = "0.18.1"
rfd = "0.18.0"
serde_json = "1.0.154"
tao = "0.37.3"
wry = "0.57.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
