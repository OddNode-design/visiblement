[package]
name = "visiblement"
version = "1.0.15"
edition = "2024"
description = "Visiblement, a fast GPU-accelerated video player for Windows built on libmpv"
license = "MIT"

[dependencies]
arboard = "3.7.0"
libloading = "0.8"
png = "0.18.1"
rfd = "0.18.0"
serde_json = "1.0.154"
tao = "0.37.3"
wry = "0.57.3"

[workspace]
members = ["thumbs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# macOS port: window helpers (src/mac.rs). Already in the tree through tao / wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry"] }
