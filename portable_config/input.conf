# Visiblement - raccourcis et menu clic droit (uosc lit les commentaires #! pour construire le menu)
mbtn_right      script-binding uosc/menu
menu            script-binding uosc/menu

ctrl+s          script-message visiblement-save-frame  #! Enregistrer la frame sous...
ctrl+c          script-message visiblement-copy-frame  #! Copier la frame
#               ignore                                 #! ---
o               script-binding uosc/open-file          #! Ouvrir un fichier...
alt+o           script-binding uosc/show-in-directory  #! Afficher dans le dossier
#               ignore                                 #! ---
space           cycle pause                            #! Lecture / Pause
pgdwn           playlist-next                          #! Vidéo suivante
pgup            playlist-prev                          #! Vidéo précédente
f               cycle fullscreen                       #! Plein écran
#               ignore                                 #! ---
#               set speed 0.5                          #! Paramètres > Vitesse > 0.5×
#               set speed 0.75                         #! Paramètres > Vitesse > 0.75×
backspace       set speed 1                            #! Paramètres > Vitesse > 1×
#               set speed 1.5                          #! Paramètres > Vitesse > 1.5×
#               set speed 2                            #! Paramètres > Vitesse > 2×
l               cycle-values loop-file inf no          #! Paramètres > Lire en boucle
a               script-binding uosc/audio              #! Paramètres > Piste audio
alt+a           script-binding uosc/audio-device       #! Paramètres > Sortie audio
s               script-binding uosc/subtitles          #! Paramètres > Sous-titres
alt+s           script-binding uosc/load-subtitles     #! Paramètres > Charger des sous-titres...
#               cycle-values hwdec auto-safe no        #! Paramètres > Décodage GPU (activer / désactiver)
#               ignore                                 #! ---
.               frame-step                             #! Image suivante
,               frame-back-step                        #! Image précédente
m               cycle mute
k               script-binding uosc/keybinds           #! Raccourcis clavier
q               quit                                   #! Quitter
