name: macOS remote session

# A GitHub Mac you can drive from your browser, with the latest Visiblement DMG installed: for testing
# by hand when nobody has a Mac. Start it from the Actions tab ("Run workflow"); the log of the
# "Browser link" step gives the address. The screen is protected by the VNC_PASSWORD repository secret
# (8 characters at most; set it once with `gh secret set VNC_PASSWORD`); no user name.
# Cancel the run to end it.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long the Mac stays up (minutes, 350 at most)"
        default: "60"

concurrency: macos-remote

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Password present
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            echo "::error::Set the VNC_PASSWORD repository secret first (gh secret set VNC_PASSWORD)."
            exit 1
          fi

      - name: Never lock the screen
        run: |
          # Idle for a few minutes while it sets up, the Mac locked its screen, and runner's password is
          # unknown: no sleep, no screen saver, no password on wake, and an assertion that keeps it awake.
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0
          defaults -currentHost write com.apple.screensaver idleTime -int 0
          defaults write com.apple.screensaver askForPassword -int 0
          sudo defaults write /Library/Preferences/com.apple.screensaver loginWindowIdleTime -int 0
          nohup caffeinate -dimsu >/dev/null 2>&1 &

      - name: Install the latest Visiblement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest release that has a DMG (a new tag gets its DMG a few minutes after the release).
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 10 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*macos-arm64.dmg' --dir "$RUNNER_TEMP" 2>/dev/null && { echo "DMG from $tag"; break; }
          done
          hdiutil attach "$RUNNER_TEMP"/*.dmg -mountpoint /Volumes/Visiblement -nobrowse
          cp -R /Volumes/Visiblement/Visiblement.app /Applications/
          hdiutil detach /Volumes/Visiblement
          # A test video on the desktop, to drag onto the app.
          brew install ffmpeg cloudflared >/dev/null
          ffmpeg -v error -f lavfi -i "testsrc2=size=1920x1080:rate=25:duration=60" -f lavfi -i "sine=frequency=440:duration=60" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest ~/Desktop/test-1080p.mp4
          open /Applications/Visiblement.app ~/Desktop/test-1080p.mp4

      - name: Screen sharing
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # Without "Screen Recording" the sharing service sends a black screen (only the cursor shows).
          # GitHub's Macs run without System Integrity Protection, so the permission can be written into the
          # system's TCC database: screen capture, plus control of the mouse and keyboard.
          db="/Library/Application Support/com.apple.TCC/TCC.db"; now=$(date +%s)
          for client in com.apple.screensharing.agent com.apple.RemoteDesktopAgent; do
            for service in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility; do
              sudo sqlite3 "$db" "INSERT OR REPLACE INTO access VALUES('$service','$client',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',0);" \
                || echo "::warning::could not grant $service to $client"
            done
          done
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -privs -all -allowAccessFor -allUsers \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD" -restart -agent -console >/dev/null
          # Wait for the VNC server.
          for i in $(seq 1 30); do nc -z localhost 5900 && break; sleep 2; done
          nc -z localhost 5900
          # The sharing service reads its permissions when it starts.
          sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
          for i in $(seq 1 30); do nc -z localhost 5900 && break; sleep 2; done

      - name: Browser link, kept up until the end
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          git clone --depth 1 https://github.com/novnc/noVNC "$RUNNER_TEMP/novnc" >/dev/null 2>&1
          # noVNC prefers Apple's login (a macOS account: logging in as another user opens a separate, black
          # session, and runner's password is unknown). Without it, plain VNC with the password shares the
          # screen of the session that is open: runner's, with Visiblement.
          sed -i '' '/_isSupportedSecurityType(type) {/,/}/ { /securityTypeARD,/d; }' "$RUNNER_TEMP/novnc/core/rfb.js"
          grep -q "securityTypeARD," "$RUNNER_TEMP/novnc/core/rfb.js" && echo "::warning::noVNC still offers Apple login"
          python3 -m pip install --quiet --break-system-packages websockify
          # Everything in this one step: background processes of an earlier step may not outlive it.
          python3 -m websockify --web "$RUNNER_TEMP/novnc" 6080 localhost:5900 >"$RUNNER_TEMP/websockify.log" 2>&1 &
          m=$(printf '%s' "$MINUTES" | tr -cd '0-9'); m=${m:-60}; [ "$m" -gt 350 ] && m=350
          end=$(( $(date +%s) + m * 60 ))
          caffeinate -dimsu &
          announced=""; announced2=""
          while [ "$(date +%s)" -lt "$end" ]; do
            # A fresh tunnel whenever the previous one is gone (cloudflared can drop the connection).
            if ! pgrep -x cloudflared >/dev/null; then
              : >"$RUNNER_TEMP/tunnel.log"
              cloudflared tunnel --no-autoupdate --url http://localhost:6080 >"$RUNNER_TEMP/tunnel.log" 2>&1 &
              announced=""
            fi
            # Second, independent tunnel (localhost.run, over SSH, no account): Cloudflare's quick tunnels
            # sometimes answer error 1033 from some places.
            if ! pgrep -f "localhost.run" >/dev/null; then
              : >"$RUNNER_TEMP/lhr.log"
              ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 80:localhost:6080 nokey@localhost.run                 >"$RUNNER_TEMP/lhr.log" 2>&1 </dev/null &
            fi
            url2=$(grep -o 'https://[a-z0-9-]*\.lhr\.life' "$RUNNER_TEMP/lhr.log" | tail -1)
            if [ -n "$url2" ] && [ "$url2" != "$announced2" ] && curl -fsS -o /dev/null --max-time 10 "$url2/vnc.html"; then
              echo "Open (2nd link): $url2/vnc.html?autoconnect=1&resize=scale   password only"
              announced2="$url2"
            fi
            url=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' "$RUNNER_TEMP/tunnel.log" | head -1)
            # Announce the link only once it answers from outside.
            if [ -n "$url" ] && [ "$url" != "$announced" ] && curl -fsS -o /dev/null --max-time 10 "$url/vnc.html"; then
              echo "::notice title=Mac in your browser::$url/vnc.html?autoconnect=1&resize=scale (no user name, password: the VNC_PASSWORD secret)"
              echo "Open: $url/vnc.html?autoconnect=1&resize=scale   password only"
              echo "### Mac in your browser: [$url/vnc.html]($url/vnc.html?autoconnect=1&resize=scale) — password: the VNC_PASSWORD secret, no user name" >> "$GITHUB_STEP_SUMMARY"
              announced="$url"
              echo "Up until $(date -r "$end"). Cancel the run to stop earlier."
            fi
            sleep 10
          done
